name: Solution CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_TEST_RUNNER: Microsoft.Testing.Platform

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0'
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore Craft_V_11.slnx

      - name: Build
        run: dotnet build Craft_V_11.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Craft_V_11.slnx --configuration Release --no-build
