name: Solution CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0'
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore Craft_V_11.slnx

      - name: Build
        run: dotnet build Craft_V_11.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Craft_V_11.slnx --configuration Release --no-build

      - name: Verify data coverage
        run: |
          dotnet test --project Tests/Data/Craft.Data.Tests/Craft.Data.Tests.csproj --configuration Release --no-build \
            --coverlet --results-directory artifacts/data-coverage --coverlet-output-format cobertura \
            --coverlet-include "[Craft.Data]*" --coverlet-include "[Craft.Identity.EntityFrameworkCore]*"
          python3 .github/scripts/verify-data-coverage.py artifacts/data-coverage

      - name: Upload data coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-coverage-${{ matrix.os }}
          path: artifacts/data-coverage/**/coverage.*.xml
          if-no-files-found: error
          retention-days: 7

      - name: Verify identity coverage
        run: |
          dotnet test --project Tests/Security/Craft.Identity.Tests/Craft.Identity.Tests.csproj \
            --configuration Release --no-build \
            --coverlet --results-directory artifacts/identity-coverage \
            --coverlet-output-format cobertura \
            --coverlet-include "[Craft.Identity]*"
          python3 .github/scripts/verify-identity-coverage.py artifacts/identity-coverage

      - name: Upload identity coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: identity-coverage-${{ matrix.os }}
          path: artifacts/identity-coverage/**/coverage.*.xml
          if-no-files-found: error
          retention-days: 7

      - name: Verify authentication coverage
        run: |
          dotnet test --project Tests/Security/Craft.Authentication.Tests/Craft.Authentication.Tests.csproj \
            --configuration Release --no-build \
            --coverlet --results-directory artifacts/authentication-coverage \
            --coverlet-output-format cobertura \
            --coverlet-include "[Craft.Authentication]*"
          python3 .github/scripts/verify-authentication-coverage.py artifacts/authentication-coverage

      - name: Upload authentication coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: authentication-coverage-${{ matrix.os }}
          path: artifacts/authentication-coverage/**/coverage.*.xml
          if-no-files-found: error
          retention-days: 7

      - name: Verify core coverage
        run: |
          dotnet test --project Tests/Core/Craft.Core.Tests/Craft.Core.Tests.csproj \
            --configuration Release --no-build \
            --coverlet --results-directory artifacts/core-coverage \
            --coverlet-output-format cobertura \
            --coverlet-include "[Craft.Core]*"
          python3 .github/scripts/verify-core-coverage.py artifacts/core-coverage

      - name: Upload core coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-coverage-${{ matrix.os }}
          path: artifacts/core-coverage/**/coverage.*.xml
          if-no-files-found: error
          retention-days: 7

      - name: Verify auditing coverage
        run: |
          dotnet test --project Tests/Security/Craft.Auditing.Tests/Craft.Auditing.Tests.csproj \
            --configuration Release --no-build \
            --coverlet --results-directory artifacts/auditing-coverage \
            --coverlet-output-format cobertura \
            --coverlet-include "[Craft.Auditing]*"
          python3 .github/scripts/verify-auditing-coverage.py artifacts/auditing-coverage

      - name: Upload auditing coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auditing-coverage-${{ matrix.os }}
          path: artifacts/auditing-coverage/**/coverage.*.xml
          if-no-files-found: error
          retention-days: 7

      - name: Verify CryptKey coverage
        run: |
          dotnet test --project Tests/Security/Craft.CryptKey.Tests/Craft.CryptKey.Tests.csproj \
            --configuration Release --no-build \
            --coverlet --results-directory artifacts/cryptkey-coverage \
            --coverlet-output-format cobertura \
            --coverlet-include "[Craft.CryptKey]*"
          python3 .github/scripts/verify-cryptkey-coverage.py artifacts/cryptkey-coverage

      - name: Upload CryptKey coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cryptkey-coverage-${{ matrix.os }}
          path: artifacts/cryptkey-coverage/**/coverage.*.xml
          if-no-files-found: error
          retention-days: 7

      - name: Verify exception coverage
        run: |
          dotnet test --project Tests/Core/Craft.Domain.Tests/Craft.Domain.Tests.csproj \
            --configuration Release --no-build \
            --coverlet --results-directory artifacts/exception-coverage \
            --coverlet-output-format cobertura --coverlet-output-format opencover \
            --coverlet-include "[Craft.Domain]Craft.Domain.Exceptions.*"
          python3 .github/scripts/verify-exception-coverage.py artifacts/exception-coverage

      - name: Upload exception coverage
        uses: actions/upload-artifact@v7
        with:
          name: exception-coverage-${{ matrix.os }}
          path: artifacts/exception-coverage/**/coverage.*.xml
          if-no-files-found: error
          retention-days: 7

      - name: Verify domain extension coverage
        run: |
          dotnet test --project Tests/Core/Craft.Domain.Tests/Craft.Domain.Tests.csproj \
            --configuration Release --no-build \
            --coverlet --results-directory artifacts/domain-extension-coverage \
            --coverlet-output-format cobertura \
            --coverlet-include "[Craft.Domain]Craft.Domain.Abstractions.DomainExtensions*" \
            --coverlet-include "[Craft.Domain]Craft.Domain.Helpers.EntityHelper*" \
            --coverlet-include "[Craft.Domain]Craft.Domain.Resources.DomainResources*" \
            --coverlet-include "[Craft.Domain]Craft.Domain.Helpers.DomainConstants*"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path("artifacts/domain-extension-coverage").rglob("coverage.cobertura*.xml"))
          if len(reports) != 1:
              raise SystemExit(f"Expected one domain extension report, found {len(reports)}")
          report = ET.parse(reports[0]).getroot()
          names = {item.attrib["name"] for item in report.findall(".//class")}
          expected = {"Craft.Domain.Abstractions.DomainExtensions", "Craft.Domain.Helpers.EntityHelper", "Craft.Domain.Resources.DomainResources", "Craft.Domain.Helpers.DomainConstants/Fv"}
          if not expected <= names:
              raise SystemExit(f"Domain helper coverage is missing: {expected - names}")
          print(f"Domain extension lines: {report.attrib['lines-covered']}/{report.attrib['lines-valid']}")
          print(f"Domain extension branches: {report.attrib['branches-covered']}/{report.attrib['branches-valid']}")
          if int(report.attrib["lines-valid"]) == 0 or int(report.attrib["branches-valid"]) == 0:
              raise SystemExit("Domain extension coverage is empty")
          if float(report.attrib["line-rate"]) != 1 or float(report.attrib["branch-rate"]) != 1:
              raise SystemExit("Domain extensions require 100% line and branch coverage")
          PY

      - name: Upload domain extension coverage
        uses: actions/upload-artifact@v7
        with:
          name: domain-extension-coverage-${{ matrix.os }}
          path: artifacts/domain-extension-coverage/**/coverage.*.xml
          if-no-files-found: error
          retention-days: 7

      - name: Verify utility coverage
        run: |
          dotnet test --project Tests/Core/Craft.Utilities.Tests/Craft.Utilities.Tests.csproj \
            --configuration Release --no-build \
            --coverlet --results-directory artifacts/utility-coverage \
            --coverlet-output-format cobertura --coverlet-output-format opencover \
            --coverlet-include "[Craft.Utilities]Craft.Utilities.Builders.StyleBuilder*" \
            --coverlet-include "[Craft.Utilities]Craft.Utilities.Builders.ValueBuilder" \
            --coverlet-include "[Craft.Utilities]Craft.Utilities.Passwords.*" \
            --coverlet-include "[Craft.Utilities]Craft.Utilities.Helpers.*"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path("artifacts/utility-coverage").rglob("coverage.cobertura*.xml"))
          if len(reports) != 1:
              raise SystemExit(f"Expected one coverage report, found {len(reports)}")
          report = ET.parse(reports[0]).getroot()
          expected = {"Craft.Utilities.Builders.StyleBuilder", "Craft.Utilities.Builders.StyleBuilderExtensions", "Craft.Utilities.Builders.ValueBuilder", "Craft.Utilities.Passwords.PasswordGenerator", "Craft.Utilities.Passwords.PasswordGeneratorService", "Craft.Utilities.Passwords.PasswordGeneratorServiceExtensions"}
          helpers = {
              "Craft.Utilities.Helpers.Timing.CountdownTimer", "Craft.Utilities.Helpers.Timing.Debouncer",
              "Craft.Utilities.Helpers.IO.FileHelper", "Craft.Utilities.Helpers.RandomHelper",
              "Craft.Utilities.Helpers.Resilience.RetryHelper", "Craft.Utilities.Helpers.Text.TextConverters",
              "Craft.Utilities.Helpers.Text.TextExtractor", "Craft.Utilities.Helpers.Text.TextSimilarity",
          }
          reported = {item.attrib["name"] for item in report.findall(".//class")}
          if not expected | helpers <= reported:
              raise SystemExit(f"Missing utility coverage: {(expected | helpers) - reported}")
          for item in report.findall(".//class"):
              print(f"{item.attrib['name']}: lines={item.attrib['line-rate']}, branches={item.attrib['branch-rate']}")
              missing = [line.attrib["number"] for line in item.findall("./lines/line") if int(line.attrib["hits"]) == 0]
              partial = [(line.attrib["number"], line.attrib.get("condition-coverage")) for line in item.findall("./lines/line")
                  if line.attrib.get("branch", "").lower() == "true" and not line.attrib.get("condition-coverage", "").startswith("100%")]
              print(f"  Uncovered lines: {missing}; partial branches: {partial}")
              if item.attrib["name"] in expected and (float(item.attrib["line-rate"]) < 1 or float(item.attrib["branch-rate"]) < 1):
                  raise SystemExit("Previously reviewed utilities require 100% line and branch coverage")
          print(f"Lines: {report.attrib['lines-covered']}/{report.attrib['lines-valid']}")
          print(f"Branches: {report.attrib['branches-covered']}/{report.attrib['branches-valid']}")
          if int(report.attrib["lines-valid"]) == 0 or int(report.attrib["branches-valid"]) == 0:
              raise SystemExit("Utility coverage is missing")

          PY

      - name: Upload utility coverage
        uses: actions/upload-artifact@v7
        with:
          name: utility-coverage-${{ matrix.os }}
          path: artifacts/utility-coverage/**/coverage.*.xml
          if-no-files-found: error
          retention-days: 7

  helper-coverage:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: utility-coverage-*
          path: artifacts/combined-coverage
      - name: Enforce complete cross-platform helper coverage
        run: python3 .github/scripts/verify-helper-coverage.py artifacts/combined-coverage

  guid-key-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0'
          dotnet-quality: preview
      - name: Build domain with GUID default keys
        run: dotnet build Source/Core/Craft.Domain/Craft.Domain.csproj --configuration Release -p:CraftDefaultKeyType=System.Guid

  guid-key-cryptkey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0'
          dotnet-quality: preview
      - name: Test CryptKey with GUID default keys
        run: dotnet test --project Tests/Security/Craft.CryptKey.Tests/Craft.CryptKey.Tests.csproj --configuration Release -p:CraftDefaultKeyType=System.Guid

  data-providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0'
          dotnet-quality: preview
      - name: Start disposable relational databases
        shell: bash
        run: |
          password="Craft_$(openssl rand -hex 18)!"
          echo "::add-mask::$password"
          docker run -d --name craft-sqlserver -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if docker exec craft-sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -Q 'SELECT 1'; then break; fi
            if [ "$i" = 60 ]; then exit 1; fi
            sleep 2
          done
          echo "CRAFT_TEST_SQLSERVER=Server=localhost;Database=craft_test_data;User ID=sa;Password=$password;TrustServerCertificate=true" >> "$GITHUB_ENV"
      - name: Test SQL Server persistence
        run: dotnet test --project Tests/Data/Craft.Data.Tests/Craft.Data.Tests.csproj --configuration Release
