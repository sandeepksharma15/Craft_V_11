name: Craft.Extensions CI

on:
  push:
    branches: [master]
    paths:
      - 'Source/Core/Craft.Extensions/**'
      - 'Tests/Core/Craft.Extensions.Tests/**'
      - '.github/workflows/craft-extensions.yml'
  pull_request:
    branches: [master]
    paths:
      - 'Source/Core/Craft.Extensions/**'
      - 'Tests/Core/Craft.Extensions.Tests/**'
      - '.github/workflows/craft-extensions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test Craft.Extensions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0'
          dotnet-quality: preview

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore Tests/Core/Craft.Extensions.Tests/Craft.Extensions.Tests.csproj

      - name: Build
        run: dotnet build Tests/Core/Craft.Extensions.Tests/Craft.Extensions.Tests.csproj --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test Tests/Core/Craft.Extensions.Tests/Craft.Extensions.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: craft-extensions-test-results
          path: |
            Tests/Core/Craft.Extensions.Tests/TestResults/**/*.trx
            Tests/Core/Craft.Extensions.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
