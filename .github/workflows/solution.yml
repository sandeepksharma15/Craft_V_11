name: Solution CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_TEST_RUNNER: Microsoft.Testing.Platform

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0'
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore Craft_V_11.slnx

      - name: Build
        run: dotnet build Craft_V_11.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Craft_V_11.slnx --configuration Release --no-build

      - name: Verify StyleBuilder coverage
        env:
          DOTNET_TEST_RUNNER: VSTest
        run: |
          dotnet test Tests/Core/Craft.Utilities.Tests/Craft.Utilities.Tests.csproj \
            --configuration Release --no-build \
            -p:TestingPlatformDotnetTestSupport=false \
            --filter FullyQualifiedName~StyleBuilder \
            --collect:"XPlat Code Coverage" --results-directory artifacts/stylebuilder-coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[Craft.Utilities]Craft.Utilities.Builders.StyleBuilder*"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path("artifacts/stylebuilder-coverage").rglob("coverage.cobertura.xml"))
          if len(reports) != 1:
              raise SystemExit(f"Expected one coverage report, found {len(reports)}")
          report = ET.parse(reports[0]).getroot()
          for item in report.findall(".//class"):
              print(f"{item.attrib['name']}: lines={item.attrib['line-rate']}, branches={item.attrib['branch-rate']}")
          print(f"Lines: {report.attrib['lines-covered']}/{report.attrib['lines-valid']}")
          print(f"Branches: {report.attrib['branches-covered']}/{report.attrib['branches-valid']}")
          if int(report.attrib["lines-valid"]) == 0 or int(report.attrib["branches-valid"]) == 0:
              raise SystemExit("StyleBuilder coverage is missing")
          if float(report.attrib["line-rate"]) < 1 or float(report.attrib["branch-rate"]) < 1:
              raise SystemExit("StyleBuilder requires 100% line and branch coverage")
          PY
